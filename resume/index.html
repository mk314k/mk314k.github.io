        <h1>Kartikesh Mishra — Co-Founder &amp; CTO at Lamina AI (YC) · MIT EECS &amp; Mathematics</h1>
        <p>
          Hi, I’m Kartikesh Mishra. I am the Co-Founder and Chief Technology Officer of <strong>Lamina AI (YC)</strong>,
          where we are building the visualization layer for AI and working to bring visual explanation everywhere text is today.
        </p>
        <p>
          Before starting Lamina, I was a software engineer at Abacus AI building factual verification and report regeneration
          pipelines for deep research agents (2M+ users), and a founding engineer at Infinirate architecting distributed real-time
          agent infrastructure.
        </p>

          <li><strong>M.Eng. in Computer Science (AI/ML)</strong>, Massachusetts Institute of Technology (2025)</li>

          <li>
            <strong>Master&apos;s Thesis (MIT CSAIL, Distributed Robotics Lab):</strong>
            <a href="https://hdl.handle.net/1721.1/163018">Minimalist Approach to End-to-End Vision Language Navigation with Multi-Modal Foundation Model Features</a>
          </li>
        </ul>
